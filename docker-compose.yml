services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml --node-ip=127.0.0.1
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"          # signaling / HTTP API
      - "7881:7881"          # TCP fallback for WebRTC
      # RTC UDP range. Keep it clear of Windows' reserved ranges
      # (`netsh interface ipv4 show excludedportrange protocol=udp`) — 50000+ is
      # usually taken by Hyper-V. Must match rtc.port_range_* in livekit.yaml.
      - "51000-51050:51000-51050/udp"
    depends_on:
      redis:
        condition: service_healthy

  # Docker Desktop (Windows/macOS) does not support host networking, so coturn is
  # opt-in: `docker compose --profile turn up -d coturn`. Локально SFU працює і без TURN.
  coturn:
    image: coturn/coturn:latest
    profiles: ["turn"]
    restart: unless-stopped
    network_mode: host
    command: >
      -n --log-file=stdout
      --realm=${TURN_REALM}
      --user=${TURN_USER}:${TURN_PASSWORD}
      --lt-cred-mech
      --listening-port=3478
      --min-port=49160 --max-port=49200
      --no-tls --no-dtls

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY}; do sleep 2; done;
      mc mb -p local/${S3_BUCKET} || true;
      mc anonymous set download local/${S3_BUCKET} || true;
      "

  api-core:
    build:
      context: ./apps/api-core
    profiles: ["full"]
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_HOST: redis
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_HTTP_URL: http://livekit:7880
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  media-ai-service:
    build:
      context: ./apps/media-ai-service
    profiles: ["full"]
    restart: unless-stopped
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_HTTP_URL: http://livekit:7880
    depends_on: [livekit, redis]

volumes:
  pgdata:
  redisdata:
  miniodata:
