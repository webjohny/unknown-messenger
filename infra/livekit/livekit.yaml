port: 7880
log_level: info

rtc:
  tcp_port: 7881
  port_range_start: 51000
  port_range_end: 51050
  use_external_ip: false

redis:
  address: redis:6379

turn:
  enabled: false   # external coturn is used instead

room:
  auto_create: false          # rooms are created explicitly by api-core
  empty_timeout: 300
  max_participants: 100

# keys are injected via LIVEKIT_KEYS env var (see docker-compose.yml)
