# Швидка перевірка того, що збирається взагалі все — без неї деплой падав би вже
# на сервері, під час `docker-compose build`, з наполовину оновленим стеком.
name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # `npm install`, а не `npm ci` — так само, як у apps/api-core/Dockerfile:
      # лок-файл там навмисно не є джерелом істини.
      - run: npm install --no-audit --no-fund
        working-directory: apps/api-core
      - run: npm run build
        working-directory: apps/api-core

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      # `build` уже містить `tsc --noEmit`, окремий typecheck зайвий.
      - run: npm run build
        working-directory: apps/web

  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: apps/media-ai-service/go.sum
      - run: go build ./...
        working-directory: apps/media-ai-service
