server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Written by docker-entrypoint.sh: the Content-Security-Policy has to name the
  # backend origins, and those are only known at container start — the same
  # reason config.js is written there rather than built in. The file carries the
  # static security headers too, so that every block below needs one include.
  #
  # It is repeated in each location on purpose. nginx does NOT inherit
  # `add_header` into a block that declares one of its own, and all three
  # locations below set Cache-Control — without the repeat, the SPA document
  # itself (served through `try_files` into `location = /index.html`) would be
  # the one response with no security headers at all.
  include /etc/nginx/messenger-headers.conf;

  # Hashed filenames, so they can never go stale.
  location /assets/ {
    include /etc/nginx/messenger-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The one file that must not be cached: it is how a running container tells
  # the bundle which backend to talk to, and it changes without the bundle.
  location = /config.js {
    include /etc/nginx/messenger-headers.conf;
    add_header Cache-Control "no-store";
  }

  location = /index.html {
    include /etc/nginx/messenger-headers.conf;
    add_header Cache-Control "no-store";
  }

  # The one screen this app allows to be framed, and only by whatever origin
  # docker-entrypoint.sh baked into messenger-embed-headers.conf. Everything
  # else keeps the frame-ancestors 'none' from messenger-headers.conf above.
  location /embed/ {
    include /etc/nginx/messenger-embed-headers.conf;
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }

  # Every path is the same document — the app reads the URL itself and picks a
  # view. Without this a reload on /room/:id would 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
